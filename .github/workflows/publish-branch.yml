name: Prepare FormPath Prestudy gh-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble verified static site
        shell: bash
        run: |
          rm -rf /tmp/formpath-site
          mkdir -p /tmp/formpath-site
          cp index.html progress.mjs quiz.mjs pyodide-worker.mjs /tmp/formpath-site/
          cat site-parts/styles.001 site-parts/styles.002 > /tmp/formpath-site/styles.css
          cat site-parts/content.001 site-parts/content.002 site-parts/content.003 site-parts/content.004 > /tmp/formpath-site/content.mjs
          cat site-parts/app.001 site-parts/app.002 site-parts/app.003 > /tmp/formpath-site/app.mjs
          touch /tmp/formpath-site/.nojekyll
          node --check /tmp/formpath-site/content.mjs
          node --check /tmp/formpath-site/app.mjs
          node --check /tmp/formpath-site/progress.mjs
          node --check /tmp/formpath-site/quiz.mjs
          node --check /tmp/formpath-site/pyodide-worker.mjs
          grep -q "id: 'm12'" /tmp/formpath-site/content.mjs
          grep -q "NOT calibrated triangulation" /tmp/formpath-site/content.mjs
          test -s /tmp/formpath-site/styles.css

      - name: Update gh-pages branch
        shell: bash
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/formpath-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
          else
            git commit -m "deploy: FormPath Prestudy"
            git push origin gh-pages
          fi
