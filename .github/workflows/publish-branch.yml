name: Prepare FormPath Prestudy gh-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore packaged site
        shell: bash
        run: |
          awk '/cat > \/tmp\/formpath-prestudy.zip.b64/{flag=1;next}/^          EOF$/{flag=0}flag{sub(/^          /,"");print}' .github/workflows/pages.yml > /tmp/formpath-prestudy.zip.b64
          base64 -d /tmp/formpath-prestudy.zip.b64 > /tmp/formpath-prestudy.zip
          rm -rf /tmp/formpath-unpacked /tmp/formpath-site
          mkdir -p /tmp/formpath-unpacked /tmp/formpath-site
          unzip -q /tmp/formpath-prestudy.zip -d /tmp/formpath-unpacked
          cp -a /tmp/formpath-unpacked/formpath-prestudy/. /tmp/formpath-site/
          rm -rf /tmp/formpath-site/tests /tmp/formpath-site/docs /tmp/formpath-site/.gitignore /tmp/formpath-site/start-formpath-prestudy.bat /tmp/formpath-site/serve.sh
          touch /tmp/formpath-site/.nojekyll
          test -f /tmp/formpath-site/index.html
          test -f /tmp/formpath-site/app.mjs
          test -f /tmp/formpath-site/content.mjs

      - name: Update gh-pages branch
        shell: bash
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/formpath-site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
          else
            git commit -m "deploy: FormPath Prestudy"
            git push origin gh-pages
          fi
